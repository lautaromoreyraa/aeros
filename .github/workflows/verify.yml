name: verify

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# Each job checks that its component exists first: the components land on
# develop through separate branches, and a branch without one of them must
# still be able to go green.
jobs:
  model:
    name: model (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model
    steps:
      - uses: actions/checkout@v5
      - id: present
        working-directory: .
        run: echo "present=$([ -f model/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.present == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model/pyproject.toml
      - if: steps.present.outputs.present == 'true'
        run: python -m pip install -e ".[dev]"
      - if: steps.present.outputs.present == 'true'
        run: ruff check .
      - if: steps.present.outputs.present == 'true'
        run: python -m pytest -q

  mcp:
    name: infra/mcp (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/mcp
    steps:
      - uses: actions/checkout@v5
      - id: present
        working-directory: .
        run: echo "present=$([ -f infra/mcp/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.present == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/mcp/package-lock.json
      - if: steps.present.outputs.present == 'true'
        run: npm ci
      - if: steps.present.outputs.present == 'true'
        run: npx tsc --noEmit
      - if: steps.present.outputs.present == 'true'
        run: npx vitest run

  aws:
    name: infra/aws (tsc + CDK assertions + synth + Lambda tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v5
      - id: present
        working-directory: .
        run: echo "present=$([ -f infra/aws/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.present == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/aws/package-lock.json
      - if: steps.present.outputs.present == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/aws/lambdas/api/requirements.txt
      - if: steps.present.outputs.present == 'true'
        run: npm ci
      - if: steps.present.outputs.present == 'true'
        run: npm run build
      - if: steps.present.outputs.present == 'true'
        run: npm test
      - if: steps.present.outputs.present == 'true'
        name: cdk synth
        # No AWS credentials: synth must work from the code alone.
        run: npx cdk synth --quiet
      - if: steps.present.outputs.present == 'true'
        run: python -m pip install -r lambdas/api/requirements.txt pytest ruff
      - if: steps.present.outputs.present == 'true'
        run: ruff check lambdas
      - if: steps.present.outputs.present == 'true'
        working-directory: infra/aws/lambdas/api
        run: python -m pytest -q
      - if: steps.present.outputs.present == 'true'
        working-directory: infra/aws/lambdas/refresh
        run: python -m pytest -q
