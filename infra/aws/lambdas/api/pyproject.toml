[project]
name = "aeros-api"
version = "0.1.0"
description = "Lambda behind POST /calendar and POST /hotspots.csv"
requires-python = ">=3.12"
dependencies = ["duckdb==2.0.0", "h3==4.5.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
